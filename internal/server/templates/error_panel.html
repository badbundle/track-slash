{{define "error-panel"}}
<section class="mx-auto max-w-6xl px-4 py-4 sm:px-6 sm:py-6">
  <div class="rounded-lg border border-slate-200 bg-white px-4 py-6 dark:border-slate-800 dark:bg-slate-900 sm:px-5">
    <div class="flex items-start gap-3">
      <i data-lucide="circle-alert" class="mt-0.5 h-5 w-5 shrink-0 text-slate-400 dark:text-slate-500" aria-hidden="true"></i>
      <div class="min-w-0">
        <div class="text-xs font-medium text-slate-500 dark:text-slate-400">Error {{.Status}}</div>
        <h1 class="mt-1 text-xl font-semibold">{{.Title}}</h1>
        <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">{{.Message}}</p>
        <a href="/" class="mt-4 inline-flex items-center gap-2 text-sm text-slate-600 hover:text-slate-950 dark:text-slate-300 dark:hover:text-white">
          <i data-lucide="arrow-left" class="h-4 w-4" aria-hidden="true"></i>
          Back to trackslash
        </a>
      </div>
    </div>
  </div>
</section>
{{end}}
